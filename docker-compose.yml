services:
  btb-app:
    image: ghcr.io/joelloveai/btb-solutions:latest
    container_name: btb-solutions
    restart: unless-stopped
    # Only reachable from inside the NAS; the Synology reverse proxy exposes it as https://app.bobthebuilderz.com
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      - UPLOAD_DIR=/app/uploads
      - NEXTAUTH_URL=https://app.bobthebuilderz.com
      - APP_URL=https://app.bobthebuilderz.com
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
    volumes:
      - /volume1/docker/btb-solutions/data:/app/data
      - /volume1/docker/btb-solutions/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
